name: "UPL Lens Development"
purpose: "Track maintained data-foundation work, practical UPL cases, project-system work, and explicitly approved retained-product maintenance."
statuses:
  - "Inbox"
  - "Scoping"
  - "Ready"
  - "In Progress"
  - "Review / QA"
  - "Done"
  - "Parked"
views:
  - name: "Active Work"
    layout: "table"
    filter: "is:open"
  - name: "Workflow"
    layout: "board"
    filter: "is:open"
  - name: "History"
    layout: "table"
    filter: "is:closed"
lanes:
  - "area: data-foundation"
  - "area: analytical-casework"
  - "area: project-system"
  - "area: retained-product"
rules:
  - "Issues move the work; docs explain the system."
  - "Use Issues for work that exceeds a small quick fix, needs planning, affects docs, or should be resumed by another agent."
  - "The UPL Status Project field owns workflow state; labels own lane, type, priority, and exceptional blockage."
  - "Done is the terminal workflow state for completed operations, filed cases, documentation, and approved maintenance; publication is optional downstream work, not a separate stage."
  - "The owner closes important Issues and approves releases or live-system mutations."
notion_boundary:
  default: "Keep ordinary UPL cases GitHub-only."
  child_record: "Use a parent-linked Notion child only after explicit owner commitment when the case has its own substantial scope, deliverable, status, done condition, and independent coordination needs."
  no_duplication: "GitHub owns execution details; Notion must not duplicate the case task list."
