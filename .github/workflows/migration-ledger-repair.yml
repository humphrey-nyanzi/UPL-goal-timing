name: Repair legacy migration ledger

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Exact owner-approved repair confirmation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upl-lens-migration-ledger-repair
  cancel-in-progress: false

jobs:
  repair-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      REPAIR_CONFIRMATION: ${{ github.event.inputs.confirmation }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_SSLMODE: ${{ secrets.POSTGRES_SSLMODE || 'prefer' }}

    steps:
      - name: Check out exact selected ref
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install database dependencies
        run: python -m pip install -r requirements-automation.txt

      - name: Validate exact owner confirmation
        run: test "$REPAIR_CONFIRMATION" = "repair-legacy-008-009-and-ledger"

      - name: Check required database secrets
        run: |
          missing=0
          for name in POSTGRES_HOST POSTGRES_PORT POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for migration-ledger repair"
              missing=1
            fi
          done
          exit "$missing"

      - name: Capture read-only preflight
        run: python scripts/data_platform/reconcile_migration_ledger.py

      - name: Run bounded transactional repair
        run: >
          python scripts/data_platform/reconcile_migration_ledger.py
          --repair
          --confirm "$REPAIR_CONFIRMATION"

      - name: Upload operator reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: migration-ledger-repair-${{ github.run_id }}
          path: outputs/automation/migration-ledger/
          if-no-files-found: error
